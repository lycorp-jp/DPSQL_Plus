[project]
name = "dpsql"
version = "0.1.0"
description = "Differentially private SQL"
authors = [
    { name = "Satoshi Hasegawa", email = "satoshi.hasegawa@lycorp.co.jp" },
    { name = "Tomoya Matsumoto", email = "tomoymat@lycorp.co.jp" },
    { name = "Shun Takagi", email = "shutakag@lycorp.co.jp" },
    { name = "Shokichi Takakura", email = "stakakur@lycorp.co.jp" },
]
dependencies = [
    "pyspark>=3.5.3",
    "dp-accounting>=0.4.4",
    "pandas>=2.2.3",
    "setuptools>=75.6.0",
    "lark>=1.2.2",
    "duckdb>=1.3.2",
    "polars>=1.32.3",
    "pyarrow>=21.0.0",
    "opendp>=0.14.1",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=2.12.1",
    "pytest-mock>=3.14.0",
    "scipy>=1.14.1",
    "ruff>=0.6.9",
    "black>=26.3.1",
    "mypy>=1.12.0",
    "sphinxcontrib-mermaid>=1.0.0",
    "esbonio>=0.16.5",
    "sphinx>=8.1.3",
    "myst-parser>=4.0.0",
    "sphinx-rtd-theme>=3.0.2",
    "ipykernel>=6.29.5",
    "seaborn>=0.13.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dpsql"]

[tool.mypy]
ignore_missing_imports = true
exclude = "examples/quickstart*\\.ipynb"

[tool.ruff]
exclude = ["examples/quickstart*.ipynb"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # Pyflakes
  "C",       # mccabe
  "I",       # isort
  "B",       # flake8-bugbear
  "UP",      # pyupgrade
]

ignore = [
  "E203",
  "D211",
  "D212",
  "E731",
]

[tool.black]
exclude = '''
/(
    \.venv
    |examples/quickstart*\.ipynb
)/
'''

[tool.pytest.ini_options]
python_functions = ["audit_*", "test_*"]
